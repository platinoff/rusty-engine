[workspace]
members = ["xtask"]
resolver = "2"

[package]
name = "rusty-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["platinoff"]
repository = "https://github.com/platinoff/rusty-engine"
homepage = "https://github.com/platinoff/rusty-engine"
description = "Pure-Rust Mixture-of-Experts inference engine (GGUF-first), orchestrated by a GSV-native master/slave supervisor; cross-compiled to exe/bin/apk."
readme = "README.md"
keywords = ["moe", "llm", "gguf", "inference", "rust"]
categories = ["science", "command-line-utilities"]

[[bin]]
name = "rusty"
path = "src/bin/rusty.rs"

[[bench]]
name = "quant"
path = "benches/quant.rs"
harness = false

[features]
# SIMD-backend markers for `PH-203` dispatch (`src/backend.rs`); all off by default so the
# portable scalar oracle is the baseline build. `select()` picks the strongest enabled one.
default = []
sse = []
avx = []
neon = []

# std-only scaffold; the single non-std runtime dep is `memmap2` (B1 PH-103). Further deps
# (tokio/axum/half/bollard) land band-by-band so `cargo build` stays offline-green.
[dependencies]
memmap2 = "0.9.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
